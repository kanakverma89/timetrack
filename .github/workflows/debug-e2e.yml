name: debug-e2e
on:
  push:
    branches: [fix/e2e-webkit-contrast]
env:
  POSTGRES_USER: timetrack
  POSTGRES_PASSWORD: ci-only-db-password
  POSTGRES_DB: timetrack
  DATABASE_URL: postgresql+psycopg://timetrack:ci-only-db-password@localhost:5432/timetrack
  SESSION_SECRET: ci-only-session-secret-0123456789-abcdefghijklmnop
  SEED_PASSWORD: ci-only-seed-password
jobs:
  webkit-one:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: timetrack
          POSTGRES_PASSWORD: ci-only-db-password
          POSTGRES_DB: timetrack
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U timetrack" --health-interval 5s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv backend/.venv && backend/.venv/bin/pip install -e "backend[dev]"
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps webkit
        working-directory: frontend
      - run: npx playwright test tests/e2e/submission.spec.ts:411 --project=webkit --reporter=line
        working-directory: frontend
