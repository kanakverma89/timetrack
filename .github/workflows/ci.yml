name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same ref supersedes an older, still-running run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_USER: timetrack
  POSTGRES_PASSWORD: ci-only-db-password
  POSTGRES_DB: timetrack
  DATABASE_URL: postgresql+psycopg://timetrack:ci-only-db-password@localhost:5432/timetrack
  SESSION_SECRET: ci-only-session-secret-0123456789-abcdefghijklmnop
  SEED_PASSWORD: ci-only-seed-password

jobs:
  backend:
    name: backend (py${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the declared minimum; 3.14 is what development uses.
        python: ["3.12", "3.14"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: timetrack
          POSTGRES_PASSWORD: ci-only-db-password
          POSTGRES_DB: timetrack
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U timetrack" --health-interval 5s
          --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app scripts
      - name: Migrations apply from an empty database and match the models
        run: alembic upgrade head && alembic check
      - run: pytest

  frontend:
    name: frontend (node${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 22 is the declared minimum line (vitest/jsdom require >=22.12 / >=22.22); 22 also runs E2E.
        node: [22, 24, 26]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: timetrack
          POSTGRES_PASSWORD: ci-only-db-password
          POSTGRES_DB: timetrack
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U timetrack" --health-interval 5s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv backend/.venv && backend/.venv/bin/pip install -e "backend[dev]"
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
