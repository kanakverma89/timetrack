# NOTE: written alongside the code but not executed in the environment that produced it.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  POSTGRES_USER: timetrack
  POSTGRES_PASSWORD: ci-only-db-password
  POSTGRES_DB: timetrack
  DATABASE_URL: postgresql+psycopg://timetrack:ci-only-db-password@localhost:5432/timetrack
  SESSION_SECRET: ci-only-session-secret-0123456789-abcdefghijklmnop
  SEED_PASSWORD: ci-only-seed-password

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: timetrack
          POSTGRES_PASSWORD: ci-only-db-password
          POSTGRES_DB: timetrack
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U timetrack" --health-interval 5s
          --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app scripts
      - name: Migrations apply from an empty database and match the models
        run: alembic upgrade head && alembic check
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: timetrack
          POSTGRES_PASSWORD: ci-only-db-password
          POSTGRES_DB: timetrack
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U timetrack" --health-interval 5s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv backend/.venv && backend/.venv/bin/pip install -e "backend[dev]"
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
