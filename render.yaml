# Render Blueprint for the free-tier portfolio demo (see docs/deployment-free-tier.md).
# Secrets are never stored here: `sync: false` values are typed into the Render dashboard once.
services:
  - type: web
    name: timetrack-demo-api
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Free instances have no pre-deploy command, so migrations run at every start (idempotent).
    # Render supplies $PORT. Forwarded headers are trusted as in the Docker image (docs: risk R-6).
    dockerCommand: >-
      sh -c 'alembic upgrade head &&
      exec uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-10000}
      --proxy-headers --forwarded-allow-ips "*" --no-server-header'
    healthCheckPath: /api/v1/health/ready
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: BUSINESS_TIMEZONE
        value: Asia/Kolkata
      - key: WEEK_START_DAY
        value: MONDAY
      # Random, 256-bit, generated by Render and visible only in its dashboard.
      - key: SESSION_SECRET
        generateValue: true
      # postgresql+psycopg://USER:PASSWORD@HOST/DB?sslmode=require  (Neon "direct" connection)
      - key: DATABASE_URL
        sync: false
      # Exactly your Vercel production URL, e.g. https://timetrack-demo.vercel.app
      - key: CORS_ORIGINS
        sync: false
